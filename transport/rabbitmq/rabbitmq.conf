# RabbitMQ Configuration for SyncKit Integration Testing

# Logging
log.console = true
log.console.level = info

# Connection settings
heartbeat = 60
tcp_listen_options.keepalive = true

# Message TTL and queue settings
default_vhost = /
default_user = synckit_user
default_pass = synckit_pass
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Management plugin
management.tcp.port = 15672

# Disk free space monitoring
disk_free_limit.absolute = 100MB

# Memory settings for testing
vm_memory_high_watermark.relative = 0.8

# Clustering (disabled for single-node testing)
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

# Enable tracing for debugging (optional)
# trace_vhosts.1 = /
